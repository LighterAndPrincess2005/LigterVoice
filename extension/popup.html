<!doctype html><html lang="vi"><meta charset="utf-8"><title>Ligter Voice</title><link rel="stylesheet" href="ui.css"><body class="popup">
<header><span class="brand">LV</span><div><h1>Ligter Voice</h1><small>Dịch từng video · 0.8.3</small></div></header>
<p id="status" role="status">Đang kiểm tra kết nối…</p>
<div class="actions"><button id="start">Dịch video này</button><button id="play" hidden>Xem bản dịch</button><button id="stop" class="secondary">Hủy</button></div>
<section id="progress" class="progress-card" hidden><div class="progress-top"><span class="progress-phase" role="status"></span><span class="progress-percent"></span></div><progress max="100" value="0"></progress><div class="progress-coverage"></div><div class="progress-detail"></div></section>
<div class="control-row"><span>Giọng đọc</span><div class="segments" id="voices"><button data-value="off">Tắt</button><button data-value="male">Nam</button><button data-value="female">Nữ</button></div></div>
<div class="control-row"><span>Phụ đề</span><div class="segments" id="subtitles"><button data-value="on">Hiện</button><button data-value="off">Ẩn</button></div></div>
<details id="options"><summary>Tùy chọn</summary><label class="option-check"><input id="wait-full" type="checkbox">Chờ chuẩn bị xong toàn bộ rồi xem</label><div class="control-row"><label for="style">Cách dịch</label><select id="style"><option value="natural">Tự nhiên</option><option value="concise">Ngắn gọn</option><option value="literal">Sát nghĩa</option></select></div><button id="panel" class="quiet">Mở bảng lời thoại</button><details id="pair"><summary>Kết nối app Windows</summary><input id="token" type="password" placeholder="Mã kết nối từ app" aria-label="Mã kết nối" autocomplete="off"><button id="connect" class="secondary">Lưu mã và kết nối</button></details></details>
<footer>Đệm phần đầu rồi xem, phần sau xử lý nền. Chỉ dịch video bạn chọn.</footer><script src="progress-view.js"></script><script src="popup.js"></script></body></html>
